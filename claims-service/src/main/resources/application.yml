spring:
  application:
    name: claim-intake-service
  datasource:
    url: jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080

logging:
  level:
    io.claimflow.intake: INFO

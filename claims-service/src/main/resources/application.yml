spring:
  application:
    name: claim-intake-service
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:h2:mem:claims;DB_CLOSE_DELAY=-1}
    username: ${CLAIMS_DB_USERNAME:sa}
    password: ${CLAIMS_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

server:
  port: ${CLAIMS_SERVER_PORT:8080}

logging:
  level:
    io.claimflow.intake: INFO

# Activated with: --spring.profiles.active=kafka
# Consumes claim events from Kafka. The producer (claims-service) uses
# JsonSerializer, which writes type headers, so JsonDeserializer can map each
# message back to its event class.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.claimflow.contracts.events"

# Full event-driven stack on the `kafka` profile:
#   claims-service --(publish)--> Kafka --(consume)--> notification-service
#
#   docker compose up --build
#
# Then:
#   curl -XPOST localhost:8080/api/claims -H 'content-type: application/json' \
#     -d '{"policyNumber":"POL-1","claimantName":"Jane Doe","type":"AUTO","amount":1200}'
#   curl localhost:8081/api/notifications
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  claims-service:
    build:
      context: .
      dockerfile: claims-service/Dockerfile
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
